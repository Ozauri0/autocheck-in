# Entorno de DESARROLLO: los secretos de aquí no sirven para producción.
name: autocheckin

services:
  mongo:
    image: mongo:8
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: autocheckin
      JWT_SECRET: dev-secret-change-me
      DEVICE_API_KEY: dev-device-key
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@uct.cl}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin1234}
      CORS_ORIGINS: http://localhost:3000
      TZ_NAME: America/Santiago
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://api:8080
      # true si el panel se sirve por HTTPS; false para usarlo por HTTP en la red local
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      - api
    restart: unless-stopped

  # HTTPS opcional para usar la cámara desde otros equipos (ver README).
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    ports:
      - "${HTTPS_PORT:-8443}:443"
    environment:
      # IP o nombre con el que se abre el panel
      HTTPS_HOST: ${HTTPS_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Conserva la autoridad certificadora: la advertencia no reaparece al recrear.
      - caddy-data:/data
    depends_on:
      - web
    restart: unless-stopped

volumes:
  mongo-data:
  caddy-data:
